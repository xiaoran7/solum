name: solum-cloud

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SOLUM_DB_OWNER_PASSWORD:?set SOLUM_DB_OWNER_PASSWORD}
      SOLUM_DB_APP_PASSWORD: ${SOLUM_DB_APP_PASSWORD:?set SOLUM_DB_APP_PASSWORD}
    volumes:
      - solum-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solum"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  solum-cloud:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SOLUM_STORAGE: postgres
      SOLUM_PORT: 8787
      SOLUM_AUTH_SECRET: ${SOLUM_AUTH_SECRET:?set SOLUM_AUTH_SECRET}
      SOLUM_ADMIN_USERNAME: ${SOLUM_ADMIN_USERNAME:?set SOLUM_ADMIN_USERNAME}
      SOLUM_ADMIN_PASSWORD: ${SOLUM_ADMIN_PASSWORD:?set SOLUM_ADMIN_PASSWORD}
      SOLUM_ALLOWED_ORIGINS: ${SOLUM_ALLOWED_ORIGINS:-}
      SOLUM_TRUST_PROXY: ${SOLUM_TRUST_PROXY:-false}
      SOLUM_BUILD_REVISION: ${SOLUM_BUILD_REVISION:-unknown}
      SOLUM_REGISTRATION_MODE: ${SOLUM_REGISTRATION_MODE:-closed}
      SOLUM_DEFAULT_MODEL: ${SOLUM_DEFAULT_MODEL:-qwen3.5-2b}
      SOLUM_ALLOWED_MODELS: ${SOLUM_ALLOWED_MODELS:-qwen3.5-2b}
      SOLUM_STANDARD_PLAN: ${SOLUM_STANDARD_PLAN:-standard}
      SOLUM_STANDARD_MONTHLY_REQUEST_LIMIT: ${SOLUM_STANDARD_MONTHLY_REQUEST_LIMIT:-1000}
      # 日/周双窗口。漏掉这两行时 buildConfig 会用进程环境里的缺省值，
      # 而 buildConfig 只在宿主 .env 里被赋值——容器内它拿到的是默认值，
      # 改 .env 的人以为改了额度，其实一直没生效。
      SOLUM_STANDARD_DAILY_REQUEST_LIMIT: ${SOLUM_STANDARD_DAILY_REQUEST_LIMIT:-1000}
      SOLUM_STANDARD_WEEKLY_REQUEST_LIMIT: ${SOLUM_STANDARD_WEEKLY_REQUEST_LIMIT:-3000}
      SOLUM_AI_MAX_RESPONSE_BYTES: ${SOLUM_AI_MAX_RESPONSE_BYTES:-8388608}
      SOLUM_AI_PENDING_TIMEOUT_SECONDS: ${SOLUM_AI_PENDING_TIMEOUT_SECONDS:-600}
      SOLUM_OAUTH_ENABLED: ${SOLUM_OAUTH_ENABLED:-true}
      SOLUM_OAUTH_ISSUER: ${SOLUM_OAUTH_ISSUER:-https://auth.tannerlab.cn}
      SOLUM_OAUTH_CLIENT_ID: ${SOLUM_OAUTH_CLIENT_ID:-solum-center}
      SOLUM_OAUTH_CLIENT_SECRET: ${SOLUM_OAUTH_CLIENT_SECRET:-}
      SOLUM_LLM_API_KEY: ${SOLUM_LLM_API_KEY:-}
      SOLUM_LLM_BASE_URL: ${SOLUM_LLM_BASE_URL:-http://100.79.74.121:8000/v1}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: solum
      PGUSER: solum_runtime
      PGPASSWORD: ${SOLUM_DB_APP_PASSWORD:?set SOLUM_DB_APP_PASSWORD}
      SOLUM_DB_POOL_MAX: ${SOLUM_DB_POOL_MAX:-10}
      SOLUM_ALERT_RETENTION_DAYS: ${SOLUM_ALERT_RETENTION_DAYS:-7}
      SOLUM_TENANT_MAX_BLOB_BYTES: ${SOLUM_TENANT_MAX_BLOB_BYTES:-1073741824}
      SOLUM_TENANT_MAX_BLOBS: ${SOLUM_TENANT_MAX_BLOBS:-100000}
      SOLUM_TENANT_MAX_DEVICES: ${SOLUM_TENANT_MAX_DEVICES:-32}
      SOLUM_BACKUP_MAX_OBJECT_BYTES: ${SOLUM_BACKUP_MAX_OBJECT_BYTES:-71303168}
      SOLUM_BACKUP_MAX_PACKAGE_BYTES: ${SOLUM_BACKUP_MAX_PACKAGE_BYTES:-734003200}
      SOLUM_BACKUP_TENANT_MAX_BYTES: ${SOLUM_BACKUP_TENANT_MAX_BYTES:-2147483648}
      SOLUM_BACKUP_MAX_OBJECTS: ${SOLUM_BACKUP_MAX_OBJECTS:-64}
      SOLUM_BACKUP_MAX_PENDING: ${SOLUM_BACKUP_MAX_PENDING:-4}
      SOLUM_BACKUP_MAX_VERSIONS: ${SOLUM_BACKUP_MAX_VERSIONS:-10}
      SOLUM_BACKUP_PENDING_TTL_HOURS: ${SOLUM_BACKUP_PENDING_TTL_HOURS:-24}
      SOLUM_EMAIL_CODE_ENABLED: ${SOLUM_EMAIL_CODE_ENABLED:-true}
      SOLUM_MAIL_HOST: ${SOLUM_MAIL_HOST:-${SOLUM_SMTP_HOST:-}}
      SOLUM_MAIL_PORT: ${SOLUM_MAIL_PORT:-${SOLUM_SMTP_PORT:-465}}
      SOLUM_MAIL_USERNAME: ${SOLUM_MAIL_USERNAME:-${SOLUM_SMTP_USER:-}}
      SOLUM_MAIL_PASSWORD: ${SOLUM_MAIL_PASSWORD:-${SOLUM_SMTP_PASS:-}}
      SOLUM_MAIL_FROM: ${SOLUM_MAIL_FROM:-${SOLUM_SMTP_FROM:-}}
      SOLUM_MAIL_FROM_NAME: ${SOLUM_MAIL_FROM_NAME:-Solum}
      SOLUM_MAIL_SUBJECT_PREFIX: ${SOLUM_MAIL_SUBJECT_PREFIX:-[Solum] }
    ports:
      - "127.0.0.1:${SOLUM_HOST_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend, edge]

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: solum
      PGPASSWORD: ${SOLUM_DB_OWNER_PASSWORD:?set SOLUM_DB_OWNER_PASSWORD}
      SOLUM_DB_APP_PASSWORD: ${SOLUM_DB_APP_PASSWORD:?set SOLUM_DB_APP_PASSWORD}
      PGHOST: postgres
    volumes:
      - ./db/init:/migrations:ro
    command:
      - /bin/sh
      - -c
      - sh /migrations/00-roles.sh && psql --set=ON_ERROR_STOP=1 --username postgres --dbname solum --file /migrations/01-schema.sql
    networks: [backend]

networks:
  backend:
    internal: true
  edge:

volumes:
  solum-postgres-data:
